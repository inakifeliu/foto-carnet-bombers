# Publica l'aplicació a GitHub Pages (HTTPS: el navegador només deixa fer servir la càmera en un context segur).
# Compila el fitxer HTML autònom de sempre (npm run build) i el publica com a index.html. La pàgina no carrega res
# extern i la seva Content-Security-Policy bloqueja qualsevol connexió: un cop descarregada, la foto es fa i es
# processa dins el dispositiu i no surt enlloc fins que l'usuari la puja manualment al formulari.
#
# Cal activar-ho una sola vegada: Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepara el lloc (index.html)
        run: |
          mkdir -p _site
          cp dist/foto-carnet-bombers-v*.html _site/index.html
          cp dist/foto-carnet-bombers-v*.html.sha256 _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
